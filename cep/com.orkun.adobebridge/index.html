<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Adobe Bridge</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px; font: 12px/1.4 -apple-system, "Helvetica Neue", sans-serif; background: #232323; color: #ddd; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c0392b; flex: none; }
  .dot.on { background: #27ae60; }
  .dot.on.busy { background: #f39c12; }
  .muted { color: #999; margin-top: 6px; word-break: break-all; }
  #log { margin-top: 8px; max-height: 70px; overflow: auto; color: #aaa; font-family: Menlo, monospace; font-size: 10px; }
  button { margin-top: 8px; background: #3a3a3a; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 3px 10px; }
</style>
</head>
<body>
  <div class="row"><div id="dot" class="dot"></div><strong id="status">Bağlanıyor…</strong></div>
  <div class="muted" id="detail">ws://127.0.0.1:8765</div>
  <button id="reconnect">Yeniden bağlan</button>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
